# Tuning parameters of the GRAHF structure search (the `train`/`pipeline` stages of
# `hm-ibf-hao`), loaded at startup — see `--training-params` in `hm-ibf --help`.
#
# Run identity (`--seed`) and file locations stay CLI flags; see hm-ibf-hao/src/cli.rs.

# Termination tolerance against the known optimum of the inner problem.
epsilon = 1e-8
# Evaluation budget of a single inner metaheuristic run; shared with the evaluate stage.
max_evaluations = 100_000
# Repetitions per instance when scoring a candidate graph.
num_repetitions = 2
# Repetitions per instance during IRACE tuning.
num_tuning_repetitions = 3
# Minimum number of IRACE experiments per candidate graph.
num_tuning_experiments = 10
# Generations of the outer structure search.
num_iterations = 4
# Upper bound IRACE may assign to an island's iteration count.
max_island_iterations = 30
# Upper bound IRACE may assign to an island's population size.
max_island_population = 15
# Allowed island working dimensions, in offsets along the backbone.
#
# The set is the recommendation derived from the Douglas-Peucker compression of each map's
# A* route: the compression estimates a route's natural dimension, and the allowed set is
# assembled from those per-map estimates so that every island searches at a resolution the
# terrain actually calls for. The shipped `[53, 60, 68]` are the natural dimensions of the
# three benchmark maps — Italy 53, Slovenia 60, Austria 68. Regenerating the instance pool
# prints a fresh recommendation; paste it here.
#
# Must be strictly increasing and positive; validated by `TrainingParams::load`.
dimensions_allowed = [53, 60, 68]

# Hyper-parameters of the outer graph-level genetic algorithm.
[grahf]
max_initial_nodes = 3
initial_edge_p = 0.3
population_size = 5
tournament_size = 2
archive_size = 1
elitist_freq = 2
pc = 0.6
rm_node = 0.12
rm_edge = 0.15
rm_node_weight = 0.08
rm_edge_weight = 0.2
